{% extends "base.html" %}

{% block title %}Create Credentials - Virtual Camera Server{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <h1>Virtual Camera Server</h1>
        <h2>Create Credentials</h2>
        <p>This is the first time setup. Please create your login credentials.</p>
        
        <form method="POST" action="{{ url_for('auth.create_credentials') }}">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm">Confirm Password:</label>
                <input type="password" id="confirm" name="confirm" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Create Credentials</button>
        </form>
    </div>
</div>
{% endblock %}
